<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verifica in itinere sui verbi · classe seconda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#0d0e1c; --card:#161831; --card2:#1d2040; --line:rgba(255,255,255,.10); --ink:#eceefb; --muted:#9aa0c8;
         --c:#8b5cf6; --on:#0d0e1c; --good:#34d399; --bad:#fb7185; }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:'Space Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:var(--ink); min-height:100vh; overflow-x:hidden; -webkit-text-size-adjust:100%;
    background:
      radial-gradient(900px 520px at 10% -10%, color-mix(in srgb,var(--c) 38%,transparent), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(34,211,238,.14), transparent 60%),
      var(--bg);
    background-attachment:fixed;
    transition:background .4s;
  }
  .deco{display:none}
  .wrap{position:relative;max-width:960px;margin:0 auto;padding:22px 16px 56px}
  .preview{background:#000;color:var(--muted);text-align:center;font-size:14px;padding:8px 12px}

  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .chip{display:inline-block;background:var(--c);color:var(--on);border-radius:10px;
    padding:6px 14px;font-weight:700;font-size:clamp(13px,1.7vw,16px);letter-spacing:.6px;text-transform:uppercase}
  .count{margin-left:auto;font-weight:500;font-size:clamp(14px,1.8vw,17px);color:var(--muted);font-variant-numeric:tabular-nums}
  .timer{font-weight:700;font-size:clamp(15px,2vw,19px);font-variant-numeric:tabular-nums;color:var(--ink);
    background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:5px 14px}
  .timer.warn{color:#fbbf24;border-color:#fbbf24}
  .timer.crit{color:var(--bad);border-color:var(--bad);animation:blink 1s steps(2,start) infinite}
  @keyframes blink{50%{opacity:.45}}
  .bar{flex-basis:100%;height:6px;background:var(--card2);border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c),#22d3ee);transition:width .35s ease;border-radius:99px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 24px 60px rgba(0,0,0,.4);
    padding:clamp(20px,3.6vw,40px);animation:pop .3s ease}
  @keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .instr{font-size:clamp(15px,1.9vw,19px);color:var(--muted);margin:0}
  .q{font-size:clamp(25px,4vw,42px);line-height:1.3;font-weight:500;margin:14px 0 28px;letter-spacing:-.4px}
  .q b{color:var(--c);font-weight:700}
  .hint{display:inline-block;background:var(--card2);border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;
    padding:6px 16px;font-weight:600;font-size:clamp(15px,2vw,20px);margin:14px 0 4px;color:var(--ink)}
  blockquote{margin:14px 0 22px;padding:16px 20px;border-left:4px solid var(--c);background:var(--card2);border-radius:0 14px 14px 0;
    font-size:clamp(20px,2.9vw,32px);line-height:1.4}

  button{font-family:inherit;color:var(--ink);cursor:pointer}
  .big{
    display:flex;align-items:center;gap:14px;text-align:left;width:100%;
    font-weight:500;font-size:clamp(19px,2.7vw,28px);line-height:1.3;
    background:var(--card2);border:1.5px solid var(--line);border-radius:14px;padding:15px 20px;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .big:hover{border-color:color-mix(in srgb,var(--c) 70%,transparent);transform:translateY(-1px)}
  .big:active{transform:translateY(1px)}
  .big.sel{background:color-mix(in srgb,var(--c) 22%,var(--card2));border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
  .big .tag{flex:none;display:inline-grid;place-items:center;width:2em;height:2em;border-radius:8px;background:var(--bg);color:var(--muted);font-weight:700;font-size:.85em}
  .big.sel .tag{background:var(--c);color:var(--on)}
  .opts{display:grid;gap:12px}
  .opts.two{grid-template-columns:1fr 1fr}
  .opts.two .big{justify-content:center;text-align:center;font-size:clamp(28px,5vw,48px);font-weight:700;padding:22px 12px}

  input[type=text],textarea,select{
    font-family:inherit;font-size:clamp(19px,2.6vw,28px);color:var(--ink);background:var(--card2);
    border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;outline:none;max-width:100%;
  }
  select option{background:var(--card2);color:var(--ink)}
  input[type=text]::placeholder,textarea::placeholder{color:#656b96}
  input[type=text]:focus,textarea:focus,select:focus{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
  .fillq{font-size:clamp(23px,3.6vw,38px);line-height:2.1;font-weight:500;margin:12px 0 22px}
  .fillq input{width:clamp(130px,24vw,280px);margin:0 4px;vertical-align:middle;text-align:center}
  textarea{width:100%;resize:vertical;line-height:1.45;font-size:clamp(18px,2.4vw,26px)}
  .an{display:grid;grid-template-columns:1fr 1fr;gap:16px 22px;margin-top:8px}
  @media(max-width:640px){.an{grid-template-columns:1fr}}
  .an label{display:block;font-weight:600;font-size:clamp(12px,1.6vw,14px);margin-bottom:6px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .an input,.an select{width:100%;font-size:clamp(18px,2.3vw,24px)}

  .row{display:flex;align-items:center;gap:16px;margin-top:28px;flex-wrap:wrap}
  .note{color:var(--bad);font-weight:500;font-size:clamp(14px,1.8vw,17px);min-height:1.2em;flex:1}
  .next{
    margin-left:auto;font-weight:700;font-size:clamp(18px,2.4vw,24px);background:var(--c);color:var(--on);
    border:none;border-radius:14px;padding:13px 32px;transition:filter .15s, transform .1s;
  }
  .next{color:var(--on)}
  .next:hover{filter:brightness(1.1)}
  .next:active{transform:translateY(1px)}
  .next[disabled]{opacity:.5;pointer-events:none}

  .hero h1{font-size:clamp(34px,7vw,66px);line-height:1.05;margin:4px 0 10px;font-weight:700;letter-spacing:-1.5px}
  .hero h1 span{background:linear-gradient(90deg,#8b5cf6,#f472b6,#fbbf24);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{font-size:clamp(17px,2.2vw,22px);margin:0 0 20px;color:var(--muted)}
  .rules{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 26px;padding:0;list-style:none}
  .rules li{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:6px 14px;font-weight:500;font-size:clamp(14px,1.8vw,17px);color:var(--muted)}
  .form{display:grid;grid-template-columns:2fr 1fr;gap:16px}
  @media(max-width:560px){.form{grid-template-columns:1fr}}
  .form label{display:block;font-weight:600;margin-bottom:6px;font-size:clamp(12px,1.6vw,14px);color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .form input{width:100%}
  .done{text-align:center}
  .done .stars{display:grid;place-items:center;width:84px;height:84px;margin:6px auto 14px;border-radius:50%;
    background:rgba(52,211,153,.14);border:2px solid var(--good)}
  .done .stars svg{width:42px;height:42px}
  .done .stars i{display:none}
  .done h2{font-size:clamp(32px,5.5vw,54px);margin:6px 0;font-weight:700;letter-spacing:-1px}
  .done p{font-size:clamp(17px,2.2vw,23px);margin:8px 0;color:var(--muted)}
  .status{display:inline-block;margin-top:16px;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:7px 18px;font-weight:500;font-size:clamp(14px,1.8vw,17px)}
  .status.bad{border-color:var(--bad);color:var(--bad)}
  .status.ok{border-color:var(--good);color:var(--good)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="previewBar" class="preview" style="display:none">Anteprima grafica: le risposte non vengono inviate al foglio Google.</div>
<div class="wrap" id="app"><noscript>Per svolgere la verifica serve JavaScript.</noscript></div>

<script>
/* Se la pagina è ospitata fuori da Google Apps Script, incolla qui l'indirizzo dell'app web (termina con /exec).
   Se resta vuoto e la pagina non è in Apps Script, funziona come anteprima e non invia nulla. */
const STATS_URL = "https://script.google.com/macros/s/AKfycbxOzT9s-UTCSBmKY8o9T2TXGnANAs1PAxd8AiZ_wqpNs7PRj4i1rYMiH5MjALLj_Tt9RA/exec";

/* ================= DATI ================= */
const ES = [
  {t:"Vero o falso", c:"#fb7185", d:"Tocca V se l'affermazione è vera, F se è falsa."},
  {t:"Scelta multipla", c:"#8b5cf6", d:"Scegli l'unica risposta corretta."},
  {t:"Completa", c:"#22d3ee", d:"Scrivi il verbo al modo e al tempo indicati."},
  {t:"Analisi del verbo", c:"#fbbf24", d:"Completa la scheda di analisi del verbo."},
  {t:"Dalla forma attiva alla passiva", c:"#60a5fa", d:"Riscrivi la frase alla forma passiva, mantenendo lo stesso tempo verbale."},
  {t:"Trasformazione di un testo", c:"#f472b6", d:"Riscrivi il brano al passato: passato remoto per le azioni concluse, imperfetto per le descrizioni e le azioni in corso."},
  {t:"Ausiliare o verbo con significato proprio?", c:"#34d399", d:"Il verbo in evidenza è un ausiliare (A) o un verbo con significato proprio (P)?"},
  {t:"Domande aperte", c:"#fb923c", d:"Rispondi con parole tue, in modo chiaro e completo."}
];
const CONJ = [["1a","1ª coniugazione (-are)"],["2a","2ª coniugazione (-ere)"],["3a","3ª coniugazione (-ire)"]];
const MODI = ["indicativo","congiuntivo","condizionale","imperativo","infinito","participio","gerundio"];
const TEMPI = ["presente","imperfetto","passato remoto","futuro semplice","passato prossimo","trapassato prossimo","trapassato remoto","futuro anteriore","passato","trapassato"];
const PERS = [["1s","1ª persona singolare"],["2s","2ª persona singolare"],["3s","3ª persona singolare"],["1p","1ª persona plurale"],["2p","2ª persona plurale"],["3p","3ª persona plurale"]];
const FORME = ["attiva","passiva","riflessiva"];
const AN_FIELDS = [
  {k:"inf",  l:"Infinito",            type:"text"},
  {k:"conj", l:"Coniugazione",        type:"sel", o:CONJ},
  {k:"modo", l:"Modo",                type:"sel", o:MODI.map(x=>[x,x])},
  {k:"tempo",l:"Tempo",               type:"sel", o:TEMPI.map(x=>[x,x])},
  {k:"pers", l:"Persona e numero",    type:"sel", o:PERS},
  {k:"forma",l:"Forma",               type:"sel", o:FORME.map(x=>[x,x])}
];

const Q = [
  /* 1 */
  {id:"vf1", es:1, type:"vf", text:"Il verbo «piovere» è un verbo impersonale."},
  {id:"vf2", es:1, type:"vf", text:"«Ho mangiato» è un tempo semplice."},
  {id:"vf3", es:1, type:"vf", text:"Nella frase «Il libro è stato letto da Marco» il verbo è alla forma passiva."},
  {id:"vf4", es:1, type:"vf", text:"I verbi della terza coniugazione terminano in -ere."},
  /* 2 */
  {id:"mc1", es:2, type:"mc", text:"Nella frase «Se avessi tempo, verrei con voi» i verbi «avessi» e «verrei» sono rispettivamente:",
    opts:["indicativo imperfetto e condizionale presente","congiuntivo imperfetto e condizionale presente","congiuntivo trapassato e condizionale passato","congiuntivo imperfetto e indicativo futuro"]},
  {id:"mc2", es:2, type:"mc", text:"In quale frase è presente un verbo riflessivo proprio?",
    opts:["Luca e Mara si abbracciano.","Il bambino si è ammalato.","Giulia si pettina.","Mi pento dell'errore."]},
  {id:"mc3", es:2, type:"mc", text:"Quale ausiliare richiede il verbo «andare» nei tempi composti?",
    opts:["Avere","Essere","Dipende dal soggetto","Uno qualsiasi dei due"]},
  /* 3 */
  {id:"c1", es:3, type:"fill", hint:"andare · passato prossimo", parts:["Ieri io ",null," al cinema."]},
  {id:"c2", es:3, type:"fill", hint:"dire · indicativo presente", parts:["Voi ",null," sempre la verità."]},
  {id:"c3", es:3, type:"fill", hint:"volere · congiuntivo imperfetto", parts:["Se tu ",null,", potremmo partire."]},
  {id:"c4", es:3, type:"fill", hint:"venire · condizionale presente", parts:["Io ",null," volentieri alla festa, ma ho un impegno."]},
  {id:"c5", es:3, type:"fill", hint:"fare · imperativo, 2ª persona singolare", parts:[null," subito i compiti!"]},
  {id:"c6", es:3, type:"fill", hint:"partire · trapassato prossimo", parts:["Quando arrivammo, loro ",null," già ",null,"."]},
  /* 4 */
  {id:"an1", es:4, type:"an", verb:"è stato corretto"},
  {id:"an2", es:4, type:"an", verb:"si alzerà"},
  {id:"an3", es:4, type:"an", verb:"mangiavamo"},
  /* 5 */
  {id:"p1", es:5, type:"line", text:"Il cuoco prepara la cena."},
  {id:"p2", es:5, type:"line", text:"Gli studenti hanno letto il romanzo."},
  /* 6 */
  {id:"t1", es:6, type:"area", rows:7, quote:"Marco entra in classe e saluta i compagni. Fuori piove e fa freddo. Il professore comincia la lezione mentre tutti prendono i quaderni.", text:""},
  /* 7 */
  {id:"au1", es:7, type:"ap", text:"Luca <b>ha</b> un cane bellissimo."},
  {id:"au2", es:7, type:"ap", text:"Luca <b>ha</b> mangiato tutto."},
  {id:"au3", es:7, type:"ap", text:"Mia sorella <b>è</b> a Roma."},
  {id:"au4", es:7, type:"ap", text:"Mia sorella <b>è</b> partita ieri."},
  /* 8 */
  {id:"o1", es:8, type:"area", rows:6, text:"Spiega la differenza tra verbo transitivo e verbo intransitivo e fai un esempio per ciascuno."},
  {id:"o2", es:8, type:"area", rows:6, text:"Spiega in due o tre righe quando si usa il modo indicativo e scrivi una frase che lo contenga."}
];

/* ================= UTILITÀ ================= */
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const stripTags = s => String(s).replace(/<[^>]+>/g, "");
const sid = Math.random().toString(36).slice(2, 10);
let i = -1, student = {name:"", cls:""}, skipArmed = false;
let pending = 0, failedN = 0, finished = false;
const DURATA = 35 * 60;            // secondi
let endAt = 0, tickId = null;
function fmt(s){ return String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"); }
function updateTimer(){
  if(!endAt || finished) return;
  const rem = Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
  const el = document.getElementById("timer");
  if(el){
    el.textContent = fmt(rem);
    el.classList.toggle("warn", rem <= 300 && rem > 60);
    el.classList.toggle("crit", rem <= 60);
  }
  if(rem === 0) timeUp();
}
function timeUp(){
  if(finished) return;
  if(i >= 0 && i < Q.length){
    const q = Q[i], a = collect(q);
    if(!isEmpty(a)) sendRec({sessione:sid, studente:student.name, classe:student.cls, id:q.id,
      esercizio:q.es + ". " + ES[q.es - 1].t, domanda:plain(q), risposta:a});
  }
  finish(true);
}

function plain(q){
  if(q.type === "fill") return q.hint + " — " + q.parts.map(p => p === null ? "___" : p).join("");
  if(q.type === "an") return "Analisi del verbo: " + q.verb;
  if(q.type === "area" && q.quote) return "Riscrivi al passato: " + q.quote;
  return stripTags(q.text);
}

/* ================= INVIO ================= */
function mode(){
  if(typeof google !== "undefined" && google.script && google.script.run) return "gas";
  return STATS_URL ? "fetch" : "preview";
}
function sendRec(rec){
  const m = mode();
  if(m === "gas"){
    pending++;
    const go = tries => {
      google.script.run
        .withSuccessHandler(() => { pending--; refreshStatus(); })
        .withFailureHandler(() => {
          if(tries < 5) setTimeout(() => go(tries + 1), 1200 * (tries + 1));
          else { pending--; failedN++; refreshStatus(); }
        })
        .salvaRisposta(rec);
    };
    go(0);
  }else if(m === "fetch"){
    try{
      fetch(STATS_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body:JSON.stringify(rec)}).catch(()=>{});
    }catch(e){}
  }
}
function refreshStatus(){
  const el = document.getElementById("status");
  if(!el) return;
  const m = mode();
  if(m === "preview"){ el.className = "status"; el.textContent = "Anteprima: nessun dato inviato."; return; }
  if(pending > 0){ el.className = "status"; el.textContent = "Sto inviando le risposte… non chiudere la pagina."; return; }
  if(failedN > 0){ el.className = "status bad"; el.textContent = "Alcune risposte non sono state inviate: avvisa l'insegnante."; return; }
  el.className = "status ok"; el.textContent = "Tutte le risposte sono state inviate.";
}

/* ================= RENDER ================= */
function setColor(c){ document.documentElement.style.setProperty("--c", c); }

function renderIntro(){
  setColor("#8b5cf6");
  app.innerHTML = `
  <div class="card hero">
    <h1><span>Verifica sui verbi</span></h1>
    <p>Classe seconda · Italiano</p>
    <ul class="rules">
      <li>25 domande</li><li>una alla volta</li><li>35 minuti</li><li>nessun feedback immediato</li>
    </ul>
    <div class="form">
      <div><label for="nm">Nome e cognome</label><input id="nm" type="text" autocomplete="off" maxlength="60"></div>
      <div><label for="cl">Classe</label><input id="cl" type="text" autocomplete="off" maxlength="8" placeholder="es. 2B"></div>
    </div>
    <div class="row"><span class="note" id="note"></span><button class="next" id="go">Inizia!</button></div>
  </div>`;
  const go = () => {
    const n = document.getElementById("nm").value.trim(), c = document.getElementById("cl").value.trim();
    if(!n || !c){ document.getElementById("note").textContent = "Scrivi nome, cognome e classe per iniziare."; return; }
    student = {name:n, cls:c};
    i = 0; endAt = Date.now() + DURATA * 1000; tickId = setInterval(updateTimer, 500); renderQ();
  };
  document.getElementById("go").onclick = go;
  app.querySelectorAll("input").forEach(el => el.addEventListener("keydown", e => { if(e.key === "Enter"){ e.preventDefault(); go(); }}));
  document.getElementById("nm").focus();
}

function renderQ(){
  const q = Q[i], e = ES[q.es - 1];
  setColor(e.c); skipArmed = false;
  let body = "";
  if(q.type === "vf"){
    body = `<div class="q">${q.text}</div>
      <div class="opts two" data-k="choice"><button class="big" data-v="V">V</button><button class="big" data-v="F">F</button></div>`;
  }else if(q.type === "ap"){
    body = `<div class="q">${q.text}</div>
      <div class="opts" data-k="choice">
        <button class="big" data-v="A"><span class="tag">A</span>Ausiliare</button>
        <button class="big" data-v="P"><span class="tag">P</span>Verbo con significato proprio</button>
      </div>`;
  }else if(q.type === "mc"){
    body = `<div class="q">${q.text}</div><div class="opts" data-k="choice">` +
      q.opts.map((o, k) => `<button class="big" data-v="${"ABCD"[k]}"><span class="tag">${"ABCD"[k]}</span>${esc(o)}</button>`).join("") + `</div>`;
  }else if(q.type === "fill"){
    body = `<div class="hint">${esc(q.hint)}</div><div class="fillq">` +
      q.parts.map(p => p === null ? `<input type="text" class="f" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Risposta">` : esc(p)).join("") + `</div>`;
  }else if(q.type === "an"){
    body = `<div class="q">Analizza il verbo: <b>${esc(q.verb)}</b></div><div class="an">` +
      AN_FIELDS.map(f => `<div><label>${f.l}</label>` + (f.type === "text"
        ? `<input type="text" class="f" autocomplete="off" autocapitalize="off" spellcheck="false">`
        : `<select class="f"><option value="">— scegli —</option>${f.o.map(o => `<option value="${esc(o[0])}">${esc(o[1])}</option>`).join("")}</select>`) + `</div>`).join("") + `</div>`;
  }else if(q.type === "line"){
    body = `<div class="q">${esc(q.text)}</div><textarea class="f" rows="2" spellcheck="false" placeholder="Scrivi la frase alla forma passiva"></textarea>`;
  }else if(q.type === "area"){
    body = (q.quote ? `<blockquote>${esc(q.quote)}</blockquote>` : `<div class="q">${esc(q.text)}</div>`) +
      `<textarea class="f" rows="${q.rows || 6}" spellcheck="false" placeholder="Scrivi qui la tua risposta"></textarea>`;
  }
  app.innerHTML = `
    <div class="top">
      <span class="chip">Esercizio ${q.es} · ${esc(e.t)}</span>
      <span class="count">Domanda ${i + 1} di ${Q.length}</span>
      <span class="timer" id="timer" aria-label="Tempo rimasto"></span>
      <div class="bar"><i style="width:${(i / Q.length * 100).toFixed(1)}%"></i></div>
    </div>
    <div class="card">
      <p class="instr">${esc(e.d)}</p>
      ${body}
      <div class="row"><span class="note" id="note"></span><button class="next" id="next">${i === Q.length - 1 ? "Consegna" : "Avanti"}</button></div>
    </div>`;
  const choice = app.querySelector('[data-k="choice"]');
  if(choice) choice.querySelectorAll("button").forEach(b => b.onclick = () => {
    choice.querySelectorAll("button").forEach(x => x.classList.remove("sel"));
    b.classList.add("sel"); document.getElementById("note").textContent = ""; skipArmed = false;
  });
  const fields = [...app.querySelectorAll(".f")];
  fields.forEach((el, k) => el.addEventListener("keydown", ev => {
    if(ev.key === "Enter" && el.tagName === "INPUT"){
      ev.preventDefault();
      if(k < fields.length - 1) fields[k + 1].focus(); else document.getElementById("next").click();
    }
  }));
  document.getElementById("next").onclick = advance;
  if(fields.length && fields[0].tagName !== "SELECT") fields[0].focus();
  updateTimer();
  window.scrollTo({top:0});
}

function collect(q){
  if(q.type === "vf" || q.type === "mc" || q.type === "ap"){
    const s = app.querySelector(".big.sel"); return s ? s.dataset.v : "";
  }
  const f = [...app.querySelectorAll(".f")].map(el => el.value.trim());
  if(q.type === "fill" || q.type === "an") return f;
  return f[0] || "";
}
const isEmpty = a => Array.isArray(a) ? a.every(x => !x) : !a;

function advance(){
  const q = Q[i], a = collect(q);
  if(isEmpty(a) && !skipArmed){
    skipArmed = true;
    document.getElementById("note").textContent = "Non hai risposto. Premi di nuovo se vuoi lasciare vuoto.";
    return;
  }
  sendRec({sessione:sid, studente:student.name, classe:student.cls, id:q.id,
           esercizio:q.es + ". " + ES[q.es - 1].t, domanda:plain(q), risposta:a});
  if(i < Q.length - 1){ i++; renderQ(); } else finish(false);
}

function finish(timeout){
  finished = true; clearInterval(tickId); setColor(timeout ? "#fbbf24" : "#34d399");
  sendRec({sessione:sid, studente:student.name, classe:student.cls, id:"fine", esercizio:"", domanda:timeout ? "Tempo scaduto" : "Verifica consegnata", risposta:""});
  app.innerHTML = `
    <div class="top"><div class="bar"><i style="width:100%"></i></div></div>
    <div class="card done">
      <div class="stars" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h2>${timeout ? "Tempo scaduto" : "Consegnato!"}</h2>
      <p>${timeout ? "Le risposte date sono state consegnate" : "Hai finito la verifica"}, ${esc(student.name)}.</p>
      <p>Puoi chiudere la pagina.</p>
      <span class="status" id="status"></span>
    </div>`;
  refreshStatus();
}

if(mode() === "preview") document.getElementById("previewBar").style.display = "block";
window.addEventListener("beforeunload", e => { if(pending > 0){ e.preventDefault(); e.returnValue = ""; } });
renderIntro();
</script>
</body>
